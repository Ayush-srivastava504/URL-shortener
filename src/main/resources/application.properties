spring.application.name=url-shortener

# --- Database (PostgreSQL, schema managed by Flyway) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/urlshortener}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Redis (redirect cache, rate limiting, click counters) ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=500ms

# --- App ---
app.base-url=${APP_BASE_URL:http://localhost:8080}
# HS256 needs a secret of at least 32 bytes. Always set JWT_SECRET outside local dev.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
app.jwt.ttl=PT1H
app.cache.ttl=PT24H
app.rate-limit.create.limit=20
app.rate-limit.create.window=PT1M
app.rate-limit.auth.limit=10
app.rate-limit.auth.window=PT1M
app.clicks.flush-interval=PT10S

management.endpoints.web.exposure.include=health,info
